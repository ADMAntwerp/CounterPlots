name: Python application

on:
  push:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Set up Python 3.10
      uses: actions/setup-python@v1
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install codecov
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        pip install pytest pytest-cov
        pip install dash plotly pandas scikit-learn
        pytest tests/ --cov="./counterplots"
        codecov --token=$CODECOV_TOKEN
    - name: Get current package version
      id: get_version
      run: |
        VERSION=$(grep -m 1 'version = ' pyproject.toml | cut -d '"' -f 2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"

    - name: Compare package versions
      id: compare_versions
      run: |
        pip install counterplots
        PYPI_VERSION=$(python -m pip show counterplots | grep Version | awk '{print $2}')
        if [[ "$PYPI_VERSION" == "${{ steps.get_version.outputs.version }}" ]]; then
          echo "Versions match ($PYPI_VERSION). No upload needed."
          echo "upload_required=false" >> $GITHUB_OUTPUT
        else
          echo "Versions differ (PyPI: $PYPI_VERSION, Local: ${{ steps.get_version.outputs.version }}). Uploading package..."
          echo "upload_required=true" >> $GITHUB_OUTPUT
        fi
        pip uninstall counterplots -y
    - name: Upload to PyPI
      if: steps.compare_versions.outputs.upload_required == 'true'
      env:
        TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade urllib3 requests-toolbelt
        pip install build twine
        python -m build
        twine upload dist/*
