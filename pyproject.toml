[project]
name = "counterplots"
version = "0.0.9"
description = "Plotting tool for counterfactual explanations"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Raphael Mazzine Barbosa de Oliveira"},
    {name = "Bjorge Meulemeester"}
]
keywords = [
    "Counterfactual Explanations",
    "Visualization",
    "Plotting",
    "Explainable Artificial Intelligence",
    "XAI",
    "Machine Learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "numpy>=1.24.3",
    "matplotlib>=3.7.1",
    "dash>=4.0.0",
    "plotly>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/ADMAntwerp/CounterPlots"
Download = "https://pypi.org/project/counterplots/"
Repository = "https://github.com/ADMAntwerp/CounterPlots"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyright]
# mpl does not work well with this
reportAttributeAccessIssue = false
reportArgumentType = false